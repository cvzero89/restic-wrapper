server: 
  db: 'backups.db'
  default_backup_interval: 24  # hours
  forget_interval_days: 7
  # auth_token: change_me  # Optional: clients must send the same token

logging:
  log_file: "server.log"
  log_level: "INFO"  # Options: DEBUG, INFO, WARNING, ERROR, CRITICAL
  max_log_size: 5242880  # 5MB in bytes
  backup_count: 5  # Keep last 5 log files