server_url: 'http://localhost:8888' ## Change to the real host and port 
check_interval: 6  # hours between checks with the server
# auth_token: change_me  # Must match auth_token in server.yaml if set
# client_id: my-laptop  # Optional: defaults to the hostname
python_interp: '/Users/user/example/venv/bin/python3' ## Change to the Python interpreter to be used

ntfy:
  enabled: true
  topic: restic-backups
  server: https://ntfy.sh
  # auth: tk_your_token_here  # Optional: token string for Bearer auth
  # auth:                      # Optional: [username, password] for Basic auth
  #   - username
  #   - password

logging:
  log_file: "client.log"
  log_level: "INFO"  # Options: DEBUG, INFO, WARNING, ERROR, CRITICAL
  max_log_size: 5242880  # 5MB in bytes
  backup_count: 5  # Keep last 5 log files